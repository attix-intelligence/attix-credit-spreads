# MSR signal-backfill universe
#
# Tickers for which we reconstruct momentum_z + flow_z + sentiment_z from
# CBOE Athena historical option candles (see compass/signals/athena_provider.py).
#
# Composition
# -----------
# * 25 ETFs   — the full vehicle set referenced by strategies/msr_etf_map.yaml,
#               so every theme that maps to a vehicle has signal coverage.
# * 30 stocks — large-cap, highly liquid names spanning the major sectors
#               (mega-cap tech / financials / healthcare / industrials /
#               energy / consumer / comms). These give the LLM
#               categorizer concrete tickers to anchor a theme on — they
#               are NOT necessarily executed (execution still goes through
#               the ETF vehicle map, with basket fallback).
#
# Field semantics
# ---------------
# * ticker         — uppercase symbol; must match CBOE Athena `symbol` column.
# * kind           — "etf" | "stock". Used by the LLM categorizer to weight
#                    whether a theme is sector-level or single-name.
# * sector         — coarse GICS-style sector. Free text; consumed only by
#                    the LLM and by validation reports.
# * industry       — sub-sector / industry label (free text).
# * market_cap_bn  — APPROXIMATE market cap in $B as a rough size hint for
#                    the LLM. Not used for fills, not used for sizing, not
#                    used for liquidity gates. Tag is "approx_2025" so that
#                    future readers know this is a static label, not a
#                    point-in-time market cap series.
#
# Rule Zero
# ---------
# * market_cap_bn is a static rough tag, NEVER referenced inside any signal
#   computation. Signals come exclusively from Athena option candles +
#   stock daily bars (see compass/signals/athena_provider.py).
# * No look-ahead: the universe is static across the backfill window. Adding
#   or removing tickers requires a re-run from the affected date forward.

meta:
  schema_version: 1
  market_cap_tag: approx_2025
  notes: >
    Universe is intentionally small (~55 names) to bound Athena scan cost.
    Expansion requires re-running the backfill for new tickers across the
    full date range.

