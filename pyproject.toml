[project]
name = "attix-credit-spreads"
version = "0.1.0"
description = "AI-powered credit spread trading system"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
  "E501",   # line too long (handled by formatter)
  "E402",   # module-level import not at top (sys.path pattern required)
  "N803",   # argument name should be lowercase (Black-Scholes: X, S, K, T)
  "N806",   # variable in function should be lowercase (financial constants: _BULL, _BEAR, _MWF)
]

# Archived / experimental / one-off script code is exempt from style + flake8 hygiene
# rules. These trees are kept for historical reference and ad-hoc runs; they are not
# part of the production execution path. Real bugs in this code are caught at runtime
# by the production callers (sentinel, executor, dashboard), not by ruff.
[tool.ruff.lint.per-file-ignores]
"compass/archive/**" = ["E", "F", "W"]
"compass/experiments/**" = ["E", "F", "W"]
"compass/exp*.py" = ["E", "F", "W"]
"tests/archive/**" = ["E", "F", "W"]
"scripts/**" = ["E", "F", "W"]
"experiments/**" = ["E", "F", "W"]
# DO NOT TOUCH list — PR #103 already modifies these files. Suppressing here
# avoids forcing a rebase on that PR while still keeping ruff clean elsewhere.
"execution/execution_engine.py" = ["F401"]
"main.py" = ["F401"]
"compass/live/vrp_runner.py" = ["E731"]
